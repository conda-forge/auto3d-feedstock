{% set name = "Auto3D" %}
{% set version = "3.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/auto3d-{{ version }}.tar.gz
  sha256: b6627db22ec55b60936daf5bf9cbf2abf83595e240bb9cef655d002d99a48be8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.7
    - pip
  run:
    - python >=3.7
    - numpy
    - pytorch
    - rdkit >=2020.09.01
    - openbabel >=3.1.1
    - pandas
    - pyyaml
    - send2trash
    - tqdm
    - psutil
    - torchani
    - ase

test:
  imports:
    - Auto3D
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/isayevlab/Auto3D_pkg
  summary: Auto3D is a Python package for generating low-energy conformers from SMILES.
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - LiuCMU
    - ghutchis
